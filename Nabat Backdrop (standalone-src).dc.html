<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<template id="__bundler_thumbnail" data-bg-color="#091B13">
  <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
    <rect width="1200" height="800" fill="#091B13"/>
    <rect x="60" y="60" width="1080" height="680" fill="none" stroke="#D4B577" stroke-width="4"/>
    <text x="120" y="260" font-family="Georgia, serif" font-style="italic" font-size="150" fill="#F4EFE4">Nabat</text>
    <circle cx="1000" cy="640" r="80" fill="none" stroke="#D4B577" stroke-width="3"/>
    <text x="1000" y="678" font-family="Georgia, serif" font-style="italic" font-size="90" fill="#D4B577" text-anchor="middle">N</text>
  </svg>
</template>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500;1,600&family=Inter+Tight:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #091B13; }
  a { color: #D4B577; text-decoration: none; }
  a:hover { color: #63D487; }
</style>
</helmet>

<div ref="{{ setRoot }}" style="position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #091B13; font-family: 'Inter Tight', system-ui, sans-serif; color: var(--ink, #F4EFE4); -webkit-font-smoothing: antialiased;">

  <!-- BASE — user image -->
  <div style="position: absolute; inset: 0;">
    <x-import component-from-global-scope="image-slot" from="./image-slot.js" id="backdrop-image" shape="rect" fit="cover" placeholder="Drop your image — a landscape, field site, or aerial ecosystem view" hint-size="100%,100%"></x-import>
  </div>

  <!-- duotone tint + scrim + vignette (all click-through) -->
  <div style="position: absolute; inset: 0; background: var(--tint, rgba(9,27,19,.52)); pointer-events: none;"></div>
  <div style="position: absolute; inset: 0; background: var(--scrim, linear-gradient(180deg, rgba(9,27,19,.35) 0%, rgba(9,27,19,.12) 30%, rgba(9,27,19,.66) 78%, rgba(9,27,19,.92) 100%)); pointer-events: none;"></div>
  <div style="position: absolute; inset: 0; background: var(--vignette, radial-gradient(72% 62% at 50% 46%, transparent 38%, rgba(9,27,19,.72) 100%)); pointer-events: none;"></div>

  <!-- grid overlay -->
  <div style="position: absolute; inset: 0; background-image: linear-gradient(var(--grid-line, rgba(244,239,228,.05)) 1px, transparent 1px), linear-gradient(90deg, var(--grid-line, rgba(244,239,228,.05)) 1px, transparent 1px); background-size: 96px 96px; background-position: center; pointer-events: none;"></div>

  <!-- BOLD off-canvas seal rings, bottom-right -->
  <div style="position: absolute; right: -440px; bottom: -440px; width: 1340px; height: 1340px; pointer-events: none;">
    <div style="position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--ring, rgba(184,153,104,.20));"></div>
    <div style="position: absolute; inset: 150px; border-radius: 50%; border: 1px solid var(--ring, rgba(184,153,104,.20));"></div>
    <div style="position: absolute; inset: 300px; border-radius: 50%; border: 2px dashed var(--ring-strong, rgba(212,181,119,.42));"></div>
    <div style="position: absolute; inset: 460px; border-radius: 50%; border: 1px solid var(--ring, rgba(184,153,104,.20));"></div>
  </div>

  <!-- BOLD wave / signal field, bottom-left -->
  <sc-if value="{{ showWave }}" hint-placeholder-val="{{ true }}">
    <div style="position: absolute; left: 0; bottom: 0; width: 1000px; height: 620px; background-image: repeating-linear-gradient(62deg, transparent 0 11px, var(--wave, rgba(212,181,119,.16)) 11px 13px); -webkit-mask-image: radial-gradient(82% 92% at 10% 100%, #000 0%, rgba(0,0,0,0) 66%); mask-image: radial-gradient(82% 92% at 10% 100%, #000 0%, rgba(0,0,0,0) 66%); pointer-events: none;"></div>
  </sc-if>

  <!-- editorial frame (bolder) -->
  <div style="position: absolute; inset: 40px; border: 2px solid var(--frame, rgba(212,181,119,.55)); pointer-events: none;"></div>
  <div style="position: absolute; inset: 54px; border: 1px solid var(--border, rgba(184,168,126,.28)); pointer-events: none;"></div>

  <!-- corner ornaments (bolder) -->
  <div style="position: absolute; top: 40px; left: 40px; width: 34px; height: 34px; border-top: 2px solid var(--gold, #D4B577); border-left: 2px solid var(--gold, #D4B577); pointer-events: none;"></div>
  <div style="position: absolute; top: 40px; right: 40px; width: 34px; height: 34px; border-top: 2px solid var(--gold, #D4B577); border-right: 2px solid var(--gold, #D4B577); pointer-events: none;"></div>
  <div style="position: absolute; bottom: 40px; left: 40px; width: 34px; height: 34px; border-bottom: 2px solid var(--gold, #D4B577); border-left: 2px solid var(--gold, #D4B577); pointer-events: none;"></div>
  <div style="position: absolute; bottom: 40px; right: 40px; width: 34px; height: 34px; border-bottom: 2px solid var(--gold, #D4B577); border-right: 2px solid var(--gold, #D4B577); pointer-events: none;"></div>

  <!-- TOP-LEFT — wordmark, bold -->
  <div style="position: absolute; top: 92px; left: 104px; display: flex; flex-direction: column; gap: 18px; pointer-events: none;">
    <div style="display: flex; align-items: baseline; gap: 18px;">
      <span style="font-family: 'Cormorant Garamond', serif; font-weight: 500; font-size: 90px; line-height: 0.9; letter-spacing: -0.015em; color: var(--ink, #F4EFE4); text-shadow: 0 2px 30px rgba(0,0,0,.35);">Nabat</span>
      <span style="font-family: 'Inter Tight', sans-serif; font-weight: 600; font-size: 14px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--gold, #D4B577); border: 1.5px solid var(--gold, #D4B577); border-radius: 2px; padding: 4px 9px; transform: translateY(-24px);">OS</span>
    </div>
    <div style="display: flex; align-items: center; gap: 16px;">
      <div style="width: 44px; height: 2px; background: var(--gold, #D4B577);"></div>
      <span style="font-family: 'Inter Tight', sans-serif; font-weight: 600; font-size: 14px; letter-spacing: 0.34em; text-transform: uppercase; color: var(--ink-soft, rgba(244,239,228,.86));">Biodiversity&nbsp;Intelligence</span>
    </div>
  </div>

  <!-- TOP-RIGHT — meta -->
  <div style="position: absolute; top: 100px; right: 104px; text-align: right; display: flex; flex-direction: column; gap: 8px; pointer-events: none;">
    <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.28em; text-transform: uppercase; color: var(--ink-muted, rgba(244,239,228,.6));">Est. 2026</span>
    <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.28em; text-transform: uppercase; color: var(--ink-muted, rgba(244,239,228,.6));">nabat.ai</span>
  </div>

  <!-- BOTTOM-LEFT — tagline, bold -->
  <div style="position: absolute; bottom: 104px; left: 104px; max-width: 900px; pointer-events: none;">
    <div style="width: 56px; height: 3px; background: var(--gold, #D4B577); margin-bottom: 26px;"></div>
    <div style="font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 500; font-size: 68px; line-height: 1.0; letter-spacing: -0.01em; color: var(--ink, #F4EFE4); text-shadow: 0 2px 30px rgba(0,0,0,.4);">The Operating System<br>for&nbsp;Nature.</div>
  </div>

  <!-- BOTTOM-RIGHT — monogram seal, bold -->
  <div style="position: absolute; bottom: 100px; right: 104px; display: flex; flex-direction: column; align-items: center; gap: 20px; pointer-events: none;">
    <div style="position: relative; width: 124px; height: 124px; border-radius: 50%; border: 2px solid var(--ring-strong, rgba(212,181,119,.6)); display: flex; align-items: center; justify-content: center;">
      <div style="position: absolute; inset: 10px; border-radius: 50%; border: 1.5px solid var(--gold, #D4B577);"></div>
      <span style="font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 500; font-size: 60px; line-height: 1; color: var(--gold, #D4B577);">N</span>
    </div>
    <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.26em; text-transform: uppercase; color: var(--ink-muted, rgba(244,239,228,.6));">nabat.ai</span>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 1920, &quot;height&quot;: 1080}, &quot;mode&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;dark&quot;, &quot;light&quot;], &quot;default&quot;: &quot;dark&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Backdrop&quot;}, &quot;showWave&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Backdrop&quot;}, &quot;showGlow&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Backdrop&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const mode = this.props.mode ?? 'dark';
    const showWave = this.props.showWave ?? true;
    const showGlow = this.props.showGlow ?? true;
    return {
      showWave,
      showGlow,
      setRoot: (el) => { this.rootEl = el; if (el) this.applyTheme(mode, showGlow); }
    };
  }

  componentDidUpdate() {
    if (this.rootEl) this.applyTheme(this.props.mode ?? 'dark', this.props.showGlow ?? true);
  }

  applyTheme(mode, showGlow) {
    const el = this.rootEl;
    if (!el) return;
    const dark = {
      '--tint': 'rgba(9,27,19,.52)',
      '--scrim': 'linear-gradient(180deg, rgba(9,27,19,.35) 0%, rgba(9,27,19,.12) 30%, rgba(9,27,19,.66) 78%, rgba(9,27,19,.92) 100%)',
      '--vignette': showGlow
        ? 'radial-gradient(72% 62% at 50% 46%, transparent 38%, rgba(9,27,19,.72) 100%)'
        : 'radial-gradient(80% 70% at 50% 50%, transparent 60%, rgba(9,27,19,.55) 100%)',
      '--grid-line': 'rgba(244,239,228,.05)',
      '--frame': 'rgba(212,181,119,.55)',
      '--border': 'rgba(184,168,126,.28)',
      '--ink': '#F4EFE4',
      '--ink-soft': 'rgba(244,239,228,.86)',
      '--ink-muted': 'rgba(244,239,228,.6)',
      '--gold': '#D4B577',
      '--ring': 'rgba(184,153,104,.20)',
      '--ring-strong': 'rgba(212,181,119,.55)',
      '--wave': 'rgba(212,181,119,.16)'
    };
    const light = {
      '--tint': 'rgba(244,239,228,.42)',
      '--scrim': 'linear-gradient(180deg, rgba(244,239,228,.28) 0%, rgba(244,239,228,.08) 30%, rgba(244,239,228,.7) 80%, rgba(235,226,206,.94) 100%)',
      '--vignette': showGlow
        ? 'radial-gradient(72% 62% at 50% 46%, transparent 40%, rgba(235,226,206,.78) 100%)'
        : 'radial-gradient(80% 70% at 50% 50%, transparent 60%, rgba(235,226,206,.55) 100%)',
      '--grid-line': 'rgba(36,108,95,.07)',
      '--frame': 'rgba(140,111,63,.6)',
      '--border': 'rgba(184,168,126,.6)',
      '--ink': '#0A1410',
      '--ink-soft': '#1C2A23',
      '--ink-muted': '#4A5A50',
      '--gold': '#8C6F3F',
      '--ring': 'rgba(140,111,63,.16)',
      '--ring-strong': 'rgba(140,111,63,.5)',
      '--wave': 'rgba(36,108,95,.14)'
    };
    const t = mode === 'light' ? light : dark;
    for (const k in t) el.style.setProperty(k, t[k]);
    document.documentElement.style.background = mode === 'light' ? '#EBE2CE' : '#091B13';
  }
}
</script>
</body>
</html>
