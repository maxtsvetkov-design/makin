<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500;1,600&family=Inter+Tight:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; }
  doc-page:not(:defined) { visibility: hidden; }
  a { color: #D4B577; text-decoration: none; }
  a:hover { color: #63D487; }
</style>
<script src="./doc-page.js"></script>
</helmet>

<doc-page size="a4">
  <section class="page">
    <div ref="{{ setRoot }}" style="position: relative; width: 100%; height: 100%; box-sizing: border-box; overflow: hidden; background: var(--bg, #0B1F17); color: var(--ink, #F4EFE4); font-family: 'Inter Tight', system-ui, sans-serif; -webkit-font-smoothing: antialiased;">

      <!-- FULL-BLEED HERO IMAGE -->
      <div style="position: absolute; inset: 0;">
        <x-import component-from-global-scope="image-slot" from="./image-slot.js" id="mangrove-hero" shape="rect" fit="cover" placeholder="Drop a mangrove image — aerial tidal forest, prop-root canopy, or estuary" hint-size="100%,100%"></x-import>
      </div>
      <!-- forest scrim so branding reads -->
      <div style="position: absolute; inset: 0; background: var(--scrim, linear-gradient(180deg, rgba(11,31,23,.78) 0%, rgba(11,31,23,.22) 34%, rgba(11,31,23,.32) 58%, rgba(11,31,23,.9) 100%)); pointer-events: none;"></div>

      <!-- editorial frame -->
      <div style="position: absolute; inset: 30px; border: 1px solid var(--frame, rgba(212,181,119,.42)); pointer-events: none;"></div>

      <!-- CONTENT -->
      <div style="position: absolute; inset: 30px; display: flex; flex-direction: column; padding: 40px 44px; pointer-events: none;">

        <!-- header -->
        <div style="display: flex; justify-content: space-between; align-items: flex-start;">
          <div style="display: flex; align-items: baseline; gap: 11px;">
            <span style="font-family: 'Cormorant Garamond', serif; font-weight: 500; font-size: 38px; line-height: 1; letter-spacing: -0.01em; color: var(--ink, #F4EFE4);">Nabat</span>
            <span style="font-family: 'Inter Tight', sans-serif; font-weight: 600; font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold, #D4B577); border: 1px solid var(--gold, #D4B577); border-radius: 2px; padding: 2px 6px; transform: translateY(-9px);">OS</span>
          </div>
          <span style="font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: 0.24em; text-transform: uppercase; color: var(--ink-muted, rgba(244,239,228,.72)); padding-top: 8px;">Field Dossier · Vol. 01</span>
        </div>

        <!-- title, anchored low -->
        <div style="margin-top: auto;">
          <div style="width: 48px; height: 2px; background: var(--gold, #D4B577); margin-bottom: 22px;"></div>
          <h1 style="margin: 0; font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 500; font-size: 96px; line-height: 0.9; letter-spacing: -0.015em; color: var(--ink, #F4EFE4); text-shadow: 0 2px 40px rgba(0,0,0,.45);">Mangrove<br>Forests</h1>
          <p style="margin: 20px 0 0; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.26em; text-transform: uppercase; color: var(--gold, #D4B577);">Coastal Blue-Carbon Systems</p>
        </div>

        <!-- footer -->
        <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-top: 34px;">
          <div style="display: flex; align-items: center; gap: 13px;">
            <div style="position: relative; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--ring-strong, rgba(212,181,119,.6)); display: flex; align-items: center; justify-content: center;">
              <span style="font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 500; font-size: 22px; line-height: 1; color: var(--gold, #D4B577);">N</span>
            </div>
            <span style="font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 400; font-size: 18px; color: var(--ink-soft, rgba(244,239,228,.85));">The Operating System for Nature.</span>
          </div>
          <span style="font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: 0.24em; text-transform: uppercase; color: var(--ink-muted, rgba(244,239,228,.72));">nabat.ai</span>
        </div>
      </div>

      <!-- POCKET DIE-LINE (folder thumb-notch) -->
      <sc-if value="{{ showPocket }}" hint-placeholder-val="{{ true }}">
        <div style="position: absolute; left: 30px; right: 30px; bottom: 30px; height: 120px; pointer-events: none;">
          <svg width="100%" height="100%" viewBox="0 0 1000 120" preserveAspectRatio="none" style="display: block;">
            <path d="M0 34 H430 C452 34 452 92 500 92 C548 92 548 34 570 34 H1000" fill="none" stroke="var(--die, rgba(212,181,119,.55))" stroke-width="1" stroke-dasharray="5 5"/>
          </svg>
          <span style="position: absolute; right: 6px; top: 4px; font-family: 'JetBrains Mono', monospace; font-size: 7.5px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--ink-muted, rgba(244,239,228,.5));">Die-line · Pocket fold</span>
        </div>
      </sc-if>

    </div>
  </section>
</doc-page>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 794, &quot;height&quot;: 1123}, &quot;mode&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;dark&quot;, &quot;light&quot;], &quot;default&quot;: &quot;dark&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Cover&quot;}, &quot;showPocket&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Cover&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const mode = this.props.mode ?? 'dark';
    return {
      showPocket: this.props.showPocket ?? true,
      setRoot: (el) => { this.rootEl = el; if (el) this.applyTheme(mode); }
    };
  }
  componentDidUpdate() { if (this.rootEl) this.applyTheme(this.props.mode ?? 'dark'); }
  applyTheme(mode) {
    const el = this.rootEl; if (!el) return;
    const dark = {
      '--bg': '#0B1F17',
      '--scrim': 'linear-gradient(180deg, rgba(11,31,23,.78) 0%, rgba(11,31,23,.22) 34%, rgba(11,31,23,.32) 58%, rgba(11,31,23,.9) 100%)',
      '--frame': 'rgba(212,181,119,.42)',
      '--ink': '#F4EFE4',
      '--ink-soft': 'rgba(244,239,228,.85)',
      '--ink-muted': 'rgba(244,239,228,.72)',
      '--gold': '#D4B577',
      '--ring-strong': 'rgba(212,181,119,.6)',
      '--die': 'rgba(212,181,119,.55)'
    };
    const light = {
      '--bg': '#F4EFE4',
      '--scrim': 'linear-gradient(180deg, rgba(244,239,228,.7) 0%, rgba(244,239,228,.12) 34%, rgba(244,239,228,.2) 58%, rgba(230,220,194,.88) 100%)',
      '--frame': 'rgba(140,111,63,.55)',
      '--ink': '#0A1410',
      '--ink-soft': '#1C2A23',
      '--ink-muted': '#4A5A50',
      '--gold': '#8C6F3F',
      '--ring-strong': 'rgba(140,111,63,.6)',
      '--die': 'rgba(140,111,63,.5)'
    };
    const t = mode === 'light' ? light : dark;
    for (const k in t) el.style.setProperty(k, t[k]);
  }
}
</script>
</body>
</html>
